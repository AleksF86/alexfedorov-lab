<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>alexfedorov.com — лаборатория</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<style>
  :root{
    --bg:#0f1117;
    --card:#171a23;
    --card-hover:#1e2230;
    --text:#e8e9ee;
    --muted:#8a8f9e;
    --accent:#5b8cff;
    --border:#252a38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:28px;margin:0 0 6px;}
  p.sub{color:var(--muted);margin:0 0 36px;font-size:15px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  a.card{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    text-decoration:none;
    color:var(--text);
    transition:background .15s ease,transform .15s ease;
  }
  a.card:hover{background:var(--card-hover);transform:translateY(-2px);}
  .card .emoji{font-size:28px;display:block;margin-bottom:10px;}
  .card .name{font-weight:600;font-size:16px;margin-bottom:4px;}
  .card .desc{color:var(--muted);font-size:13px;}
  footer{margin-top:50px;color:var(--muted);font-size:12px;text-align:center;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>alexfedorov.com</h1>
    <p class="sub">Площадка для экспериментов — игры, интерфейсы, маленькие приложения.</p>
    <div class="grid">
      <a class="card" href="/games/dice/">
        <span class="emoji">🎲</span>
        <div class="name">Кто больше</div>
        <div class="desc">Кидаем кубики по очереди, у кого сумма больше — тот победил</div>
      </a>
    </div>
    <footer>обновляется постоянно</footer>
  </div>
</body>
</html>
