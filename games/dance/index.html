<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>HitDance</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0714">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0714;
    --panel:#171226;
    --panel2:#1f1832;
    --text:#f3eefc;
    --muted:#9a8fc0;
    --border:#2c2444;
    --pink:#ff4f9a;
    --cyan:#33e6ff;
    --purple:#b06bff;
    --yellow:#ffd23f;
    --good:#33e6ff;
    --gold:#ffd23f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% 0%, #201436 0%, var(--bg) 60%);
    color:var(--text);
    font-family:'Unbounded',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100%;
    padding:16px 12px 24px;
    overflow-x:hidden;
  }
  button, input{font-family:inherit;}
  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;flex:1;}
  .top{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  a.back{color:var(--muted);text-decoration:none;font-size:13px;}
  h1.logo{
    font-size:20px;margin:0;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:800;letter-spacing:.5px;
  }

  /* screens */
  .screen{width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;justify-content:center;}
  .screen[hidden]{display:none;}

  .avatar{width:92px;height:92px;margin-bottom:6px;display:inline-block;transition:transform .15s ease, filter .2s ease;filter:drop-shadow(0 0 12px rgba(176,107,255,.5));}
  .avatar svg{width:100%;height:100%;display:block;overflow:visible;}
  .avatar.pop{animation:pop .25s ease;}
  .avatar.shake{animation:shake .3s ease;}
  .avatar.hype{animation:hype .4s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  @keyframes hype{0%{transform:scale(1) rotate(0);}30%{transform:scale(1.5) rotate(-8deg);}60%{transform:scale(1.3) rotate(6deg);}100%{transform:scale(1) rotate(0);}}

  .dancer{animation:dancerBob 1.15s ease-in-out infinite;animation-delay:var(--d,0s);}
  @keyframes dancerBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
  .armL{animation:armSwingL 1.15s ease-in-out infinite;animation-delay:var(--d,0s);}
  .armR{animation:armSwingR 1.15s ease-in-out infinite;animation-delay:var(--d,0s);}
  .legL{animation:legSwingL 1.15s ease-in-out infinite;animation-delay:var(--d,0s);}
  .legR{animation:legSwingR 1.15s ease-in-out infinite;animation-delay:var(--d,0s);}
  @keyframes armSwingL{0%,100%{transform:rotate(-10deg);}50%{transform:rotate(40deg);}}
  @keyframes armSwingR{0%,100%{transform:rotate(10deg);}50%{transform:rotate(-40deg);}}
  @keyframes legSwingL{0%,100%{transform:rotate(-12deg);}50%{transform:rotate(14deg);}}
  @keyframes legSwingR{0%,100%{transform:rotate(12deg);}50%{transform:rotate(-14deg);}}

  #startScreen p.sub{color:var(--muted);font-size:14px;margin:6px 0 18px;max-width:320px;}
  .nameInput{
    width:220px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:15px;text-align:center;outline:none;margin-bottom:18px;
  }
  .nameInput:focus{border-color:var(--purple);}
  .nameWarn{color:var(--gold);font-size:12px;margin:-12px 0 16px;min-height:14px;}
  .nameStreak{color:var(--gold);font-size:13px;font-weight:700;margin:-12px 0 16px;min-height:14px;}
  .statsBtn{
    margin-top:18px;border:none;color:#fff;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    padding:13px 28px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;
    box-shadow:0 6px 18px rgba(51,230,255,.35);
  }
  .statsBtn:active{transform:translateY(1px);}
  .bigbtn{
    padding:16px 46px;border:none;border-radius:16px;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    color:#fff;font-size:18px;font-weight:800;cursor:pointer;
    box-shadow:0 8px 24px rgba(255,79,154,.35);
  }
  .bigbtn:active{transform:translateY(1px);}
  .howto{display:flex;gap:12px;margin-top:26px;}
  .howto .k{
    width:52px;height:52px;border-radius:14px;border:none;color:#fff;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--lc) 55%, white) 0%, var(--lc) 55%, color-mix(in srgb, var(--lc) 70%, black) 100%);
    box-shadow:
      0 4px 0 color-mix(in srgb, var(--lc) 50%, black),
      0 6px 10px rgba(0,0,0,.4),
      inset 0 2px 2px rgba(255,255,255,.5),
      inset 0 -2px 3px rgba(0,0,0,.25);
  }
  .howto .k svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}

  /* game screen */
  #gameScreen{justify-content:flex-start;}
  .hud{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .hud .score{font-size:22px;font-weight:800;}
  .hud .combo{font-size:16px;color:var(--gold);font-weight:800;transition:transform .15s ease;}
  .hud .combo.pop{animation:pop .25s ease;}
  .hud .combo.shake{animation:shake .3s ease;}
  .hud .combo.hype{animation:hype .4s ease;}

  .timerRow{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .timerRow .time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:32px;}
  .timerBar{flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;}
  .timerFill{height:100%;width:0%;background:linear-gradient(90deg,var(--pink),var(--cyan));}

  .historyBox{
    width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:12px;
    padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--muted);
  }
  .historyBox b{color:var(--text);}
  .historyBox .hLine{display:flex;justify-content:space-between;padding:3px 0;}

  .stage{
    position:relative;width:100%;
    height:min(56vh,420px);
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;margin:8px 0 12px;
  }
  .lanes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);}
  .lane{position:relative;border-right:1px solid rgba(255,255,255,.04);}
  .lane:last-child{border-right:none;}
  .lane .zoneGlow{
    position:absolute;left:6%;right:6%;bottom:calc(16% - 22px);height:44px;border-radius:12px;
    border:2px solid var(--lc);opacity:.35;
  }
  .note{
    position:absolute;left:8%;right:8%;height:40px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:radial-gradient(circle at 35% 25%, color-mix(in srgb, var(--lc) 55%, white) 0%, var(--lc) 60%, color-mix(in srgb, var(--lc) 70%, black) 100%);
    box-shadow:
      0 0 18px var(--lc),
      inset 0 2px 3px rgba(255,255,255,.55),
      inset 0 -3px 4px rgba(0,0,0,.25);
  }
  .note svg{width:24px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));}
  .fx{
    position:absolute;left:8%;right:8%;bottom:calc(16% - 30px);height:60px;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
    opacity:0;pointer-events:none;
  }
  .fx.show{animation:fxpop .45s ease forwards;}
  @keyframes fxpop{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-24px) scale(1.15);}}

  .particle{
    position:absolute;left:50%;bottom:16%;border-radius:50%;
    pointer-events:none;
    box-shadow:0 0 8px 2px currentColor;
    animation:burst .75s ease-out forwards;
  }
  @keyframes burst{
    0%{transform:translate(-50%,50%) translate(0,0) scale(1);opacity:1;}
    60%{opacity:1;}
    100%{transform:translate(-50%,50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0;}
  }
  .spark{
    position:absolute;left:50%;bottom:16%;width:3px;
    pointer-events:none;border-radius:2px;
    animation:sparkburst .6s ease-out forwards;
  }
  @keyframes sparkburst{
    0%{transform:translate(-50%,50%) translate(0,0) rotate(var(--rot)) scaleY(1);opacity:1;}
    100%{transform:translate(-50%,50%) translate(var(--dx),var(--dy)) rotate(var(--rot)) scaleY(.3);opacity:0;}
  }

  .countdown{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 20px var(--purple);
    background:rgba(11,7,20,.55);z-index:5;
  }
  .countdown[hidden]{display:none;}

  .controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;}
  .padBtn{
    position:relative;padding:26px 0;border-radius:18px;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--lc) 55%, white) 0%, var(--lc) 55%, color-mix(in srgb, var(--lc) 65%, black) 100%);
    box-shadow:
      0 6px 0 color-mix(in srgb, var(--lc) 50%, black),
      0 10px 16px rgba(0,0,0,.45),
      inset 0 3px 4px rgba(255,255,255,.55),
      inset 0 -4px 6px rgba(0,0,0,.3);
    transition:transform .07s ease, box-shadow .07s ease;
  }
  .padBtn svg{width:34px;height:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
  .padBtn.active{
    transform:translateY(5px);
    box-shadow:
      0 1px 0 color-mix(in srgb, var(--lc) 50%, black),
      0 2px 6px rgba(0,0,0,.4),
      inset 0 3px 5px rgba(0,0,0,.35);
  }

  /* end screen */
  #endScreen .rank{font-size:30px;font-weight:900;margin-bottom:10px;max-width:100%;overflow-wrap:break-word;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .rankBadge{
    display:inline-block;padding:5px 16px;border-radius:20px;margin-bottom:16px;
    background:var(--panel2);border:1px solid var(--border);
    font-size:13px;font-weight:800;color:var(--gold);
  }
  #endScreen .msg{font-size:16px;font-weight:700;margin-bottom:18px;}
  .statrow{display:flex;gap:24px;margin-bottom:26px;}
  .statrow div{text-align:center;}
  .statrow .num{font-size:22px;font-weight:800;}
  .statrow .lbl{font-size:11px;color:var(--muted);}
  .endbtns{display:flex;gap:8px;width:100%;}
  .endbtns button, .endbtns a{
    flex:1;min-width:0;text-align:center;box-sizing:border-box;
    font-family:inherit;padding:13px 6px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:12px;font-weight:700;
    text-decoration:none;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #homeBtn{background:linear-gradient(90deg,var(--gold),var(--pink));border:none;color:#160c24;box-shadow:0 4px 14px rgba(245,210,63,.3);}
  .endbtns button.primary{background:linear-gradient(90deg,var(--pink),var(--purple));border:none;color:#fff;}
  #endStatsBtn{background:linear-gradient(90deg,var(--cyan),var(--purple));border:none;color:#fff;box-shadow:0 4px 14px rgba(51,230,255,.3);}

  /* stats screen */
  #statsScreen{align-items:stretch;}
  #statsScreen h2{font-size:20px;margin:0 0 16px;text-align:center;}
  .statsList{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .statsRow{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;
  }
  .statsRow[data-name]{cursor:pointer;transition:background .15s ease,transform .1s ease;}
  .statsRow[data-name]:active{transform:scale(.98);background:var(--panel2);}
  .statsRow .pos{width:22px;font-weight:800;color:var(--muted);font-size:13px;}
  .statsRow .pname{flex:1;font-weight:700;font-size:14px;}
  .statsRow .pscore{font-weight:800;color:var(--gold);font-size:15px;}
  .statsRow .pgames{font-size:11px;color:var(--muted);margin-left:8px;}
  .statsEmpty{text-align:center;color:var(--muted);font-size:14px;padding:30px 0;}
  .backToList{
    background:none;border:none;color:var(--purple);font-family:inherit;
    font-size:13px;font-weight:700;cursor:pointer;padding:0 0 14px;text-align:left;
  }
  .playerDetailHead{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);
  }
  .pdName{font-size:19px;font-weight:800;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;}

  .badgesTitle{font-size:13px;color:var(--muted);font-weight:700;margin:18px 0 10px;}
  .badgeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .badge{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:10px 4px;opacity:.35;filter:grayscale(1);
  }
  .badge.unlocked{opacity:1;filter:none;border-color:var(--gold);background:var(--panel2);}
  .badgeIcon{font-size:22px;}
  .badgeName{font-size:9px;color:var(--muted);text-align:center;line-height:1.2;}
  .badge.unlocked .badgeName{color:var(--text);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="back" href="/">← на главную</a>
      <h1 class="logo">HitDance</h1>
      <span style="width:60px"></span>
    </div>

    <div class="screen" id="startScreen">
      <div class="avatar" id="avatarStart"></div>
      <p class="sub">Лови движения в такт биту — на телефоне тапай по кнопкам, на компьютере жми стрелки.</p>
      <input type="text" class="nameInput" id="playerNameInput" placeholder="Твоё имя" maxlength="16">
      <div class="nameWarn" id="nameWarn"></div>
      <div class="nameStreak" id="nameStreak"></div>
      <button class="bigbtn" id="playBtn">Играть</button>
      <div class="howto" id="howto"></div>
      <button class="statsBtn" id="statsBtn">Статистика игроков</button>
    </div>

    <div class="screen" id="statsScreen" hidden>
      <h2>Статистика игроков</h2>
      <div class="statsList" id="statsList"></div>
      <button class="bigbtn" id="statsBackBtn" style="padding:12px 36px;font-size:15px;">Назад</button>
    </div>

    <div class="screen" id="gameScreen" hidden>
      <div class="hud">
        <div class="score" id="scoreVal">0</div>
        <div class="combo" id="comboVal">Комбо: 0</div>
      </div>
      <div class="timerRow">
        <span class="time" id="timeLeft">0:00</span>
        <div class="timerBar"><div class="timerFill" id="timerFill"></div></div>
      </div>
      <div class="stage" id="stage">
        <div class="lanes" id="lanes"></div>
        <div class="countdown" id="countdown" hidden>3</div>
      </div>
      <div class="controls" id="controls"></div>
    </div>

    <div class="screen" id="endScreen" hidden>
      <div class="rank" id="rankVal">Игрок</div>
      <div class="rankBadge" id="rankBadgeVal">Звезда сцены</div>
      <div class="msg" id="rankMsg">Огонь!</div>
      <div class="statrow">
        <div><div class="num" id="finalScore">0</div><div class="lbl">очки</div></div>
        <div><div class="num" id="finalCombo">0</div><div class="lbl">макс. комбо</div></div>
        <div><div class="num" id="finalAcc">0%</div><div class="lbl">точность</div></div>
      </div>
      <div class="historyBox" id="historyBox" hidden>
        <div class="hLine"><span>Личный рекорд</span><b id="bestScoreVal">-</b></div>
        <div class="hLine"><span>Сыграно попыток</span><b id="playCountVal">-</b></div>
      </div>
      <div class="endbtns">
        <a href="/" id="homeBtn">На главную</a>
        <button id="endStatsBtn">Статистика</button>
        <button class="primary" id="againBtn">Играть ещё</button>
      </div>
    </div>
  </div>

<script>
const LANES = [
  {key:'ArrowLeft',  dir:'left',  color:'var(--pink)'},
  {key:'ArrowUp',    dir:'up',    color:'var(--purple)'},
  {key:'ArrowDown',  dir:'down',  color:'var(--cyan)'},
  {key:'ArrowRight', dir:'right', color:'var(--yellow)'},
];

const ARROW_PATHS = {
  left:  'M15 5 L15 19 L5 12 Z',
  up:    'M5 15 L19 15 L12 5 Z',
  down:  'M5 9 L19 9 L12 19 Z',
  right: 'M9 5 L9 19 L19 12 Z',
};
function arrowIcon(dir){
  return `<svg viewBox="0 0 24 24"><path d="${ARROW_PATHS[dir]}" fill="currentColor"/></svg>`;
}

const lanesEl = document.getElementById('lanes');
const controlsEl = document.getElementById('controls');
const howtoEl = document.getElementById('howto');
LANES.forEach((l,i) => {
  const lane = document.createElement('div');
  lane.className = 'lane';
  lane.style.setProperty('--lc', l.color);
  lane.dataset.lane = i;
  lane.innerHTML = `<div class="zoneGlow"></div><div class="fx" id="fx${i}"></div>`;
  lanesEl.appendChild(lane);

  const btn = document.createElement('button');
  btn.className = 'padBtn';
  btn.style.setProperty('--lc', l.color);
  btn.innerHTML = arrowIcon(l.dir);
  btn.dataset.lane = i;
  controlsEl.appendChild(btn);

  const k = document.createElement('div');
  k.className = 'k';
  k.style.setProperty('--lc', l.color);
  k.innerHTML = arrowIcon(l.dir);
  howtoEl.appendChild(k);
});

let audioCtx = null;
function beep(time, freq, dur, type, vol){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, time);
  gain.gain.setValueAtTime(vol, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + dur);
}
function playKick(t){ beep(t, 110, 0.18, 'sine', 0.5); }
function playCount(t){ beep(t, 440, 0.12, 'square', 0.3); }

function playHat(t, vol){
  const len = audioCtx.sampleRate * 0.045;
  const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 7000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  src.connect(filter).connect(gain).connect(audioCtx.destination);
  src.start(t);
}

const RANK_TITLES = {S:'Звезда сцены', A:'Профи танцпола', B:'Уверенный ритм', C:'Есть потенциал', D:'Новичок'};

const ACHIEVEMENTS = [
  {icon:'🎮', name:'Первый шаг',    desc:'Сыграй первую партию',   check:p => p.games_played >= 1},
  {icon:'🕹️', name:'Постоянство',   desc:'Сыграй 10 партий',       check:p => p.games_played >= 10},
  {icon:'⚡', name:'Разогналась',   desc:'Комбо от 10 подряд',     check:p => p.best_combo >= 10},
  {icon:'🔥', name:'Без остановки', desc:'Комбо от 25 подряд',     check:p => p.best_combo >= 25},
  {icon:'🎯', name:'Меткость',      desc:'Точность от 90%',        check:p => p.best_accuracy >= 90},
  {icon:'💯', name:'Идеально',      desc:'Точность 100%',          check:p => p.best_accuracy >= 100},
  {icon:'📅', name:'Втянулась',     desc:'3 дня подряд',           check:p => p.streak_days >= 3},
  {icon:'🏆', name:'Неделя огня',   desc:'7 дней подряд',          check:p => p.streak_days >= 7},
];

const CHORDS = [
  { bass: 110.00, notes: [220.00, 261.63, 329.63] },
  { bass: 87.31,  notes: [174.61, 220.00, 261.63] },
  { bass: 130.81, notes: [261.63, 329.63, 392.00] },
  { bass: 98.00,  notes: [196.00, 246.94, 293.66] },
];

function playHitSound(level){
  const t = audioCtx.currentTime;
  const freq = 523.25 * Math.pow(2, Math.min(level, 18) / 12);
  beep(t, freq, 0.16, 'triangle', 0.28);
  beep(t, freq * 1.5, 0.16, 'sine', 0.12);
}
function playMissSound(){
  const t = audioCtx.currentTime;
  beep(t, 140, 0.18, 'sine', 0.18);
}

const BPM = 100;
const beatSec = 60/BPM;
const PRE_ROLL_SECONDS = 3;
const totalBeats = 49;
const ROUND_SECONDS = 30;
const fallDuration = 1.1;
const PERFECT_WIN = 0.09;
const GOOD_WIN = 0.18;
const MISS_WIN = 0.26;

let events = [];
let startTime = 0;
let score = 0, combo = 0, maxCombo = 0, perfectCount = 0, goodCount = 0, missCount = 0;
let rafId = null;
let noteEls = new Map();

function buildEvents(){
  events = [];
  let lastLane = -1;
  function pickLane(){
    let l;
    do { l = Math.floor(Math.random()*4); } while(l===lastLane && Math.random()<0.7);
    lastLane = l;
    return l;
  }
  for(let b=0;b<totalBeats;b++){
    const t = PRE_ROLL_SECONDS + b*beatSec;
    const section = b<Math.round(totalBeats*0.25) ? 0 : b<Math.round(totalBeats*0.625) ? 1 : 2;
    if(section===0){
      if(Math.random()<0.7) events.push({time:t, lane:pickLane(), judged:false});
    } else if(section===1){
      events.push({time:t, lane:pickLane(), judged:false});
      if(Math.random()<0.25) events.push({time:t+beatSec/2, lane:pickLane(), judged:false});
    } else {
      events.push({time:t, lane:pickLane(), judged:false});
      if(Math.random()<0.55) events.push({time:t+beatSec/2, lane:pickLane(), judged:false});
    }
  }
  events = events.filter(e => e.time >= PRE_ROLL_SECONDS + fallDuration);
  events.sort((a,b)=>a.time-b.time);
  events.forEach(e => {
    e.spawnTime = e.time - fallDuration;
    e.fallDur = fallDuration;
  });
}

function scheduleAudio(){
  const base = audioCtx.currentTime + 0.15;
  for(let s=0;s<PRE_ROLL_SECONDS;s++){
    playCount(base + s);
  }
  for(let b=0;b<totalBeats;b++){
    const t = base + PRE_ROLL_SECONDS + b*beatSec;
    const chord = CHORDS[Math.floor(b/4) % CHORDS.length];
    playKick(t);
    if(b % 2 === 0){
      beep(t, chord.bass, 0.3, 'triangle', 0.22);
    }
    if(b % 4 === 0){
      chord.notes.forEach(f => beep(t, f, 0.5, 'sawtooth', 0.05));
    }
    playHat(t, 0.1);
    playHat(t + beatSec/2, 0.07);
  }
  return base;
}

const gameScreen = document.getElementById('gameScreen');
const endScreen = document.getElementById('endScreen');
const stage = document.getElementById('stage');
const countdownEl = document.getElementById('countdown');
const scoreVal = document.getElementById('scoreVal');
const comboVal = document.getElementById('comboVal');

    <g class="dancer" style="--d:${delay}">
      <circle cx="0" cy="-42" r="9" fill="${color}"/>
      <line x1="0" y1="-32" x2="0" y2="0" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
      <g class="armL" style="transform-origin:-6px -27px">
        <line x1="-6" y1="-27" x2="-22" y2="-8" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
      </g>
      <g class="armR" style="transform-origin:6px -27px">
        <line x1="6" y1="-27" x2="22" y2="-8" stroke="${color}" stroke-width="9" stroke-linecap="round"/>
      </g>
      <g class="legL" style="transform-origin:-5px 0px">
        <line x1="-5" y1="0" x2="-14" y2="46" stroke="${color}" stroke-width="9" stroke-linecap="round"/>

document.getElementById('avatarStart').innerHTML = trioSVG();

const playerNameInput = document.getElementById('playerNameInput');
const timeLeftEl = document.getElementById('timeLeft');
const timerFillEl = document.getElementById('timerFill');
let songDuration = 0;

const nameWarn = document.getElementById('nameWarn');
const nameStreak = document.getElementById('nameStreak');
let nameCheckToken = 0;

async function checkNameExists(){
  const name = (playerNameInput.value || '').trim();
  if(!name){ nameWarn.textContent = ''; nameStreak.textContent = ''; return; }
  const token = ++nameCheckToken;
  try {
    const res = await fetch('/api/stats.php?game=dance');
    const data = await res.json();
    if(token !== nameCheckToken) return;
    const p = data.ok ? data.players.find(pl => pl.player_name === name) : null;
    if(p){
      nameWarn.textContent = 'Игрок «' + name + '» уже есть в истории — если это не ты, выбери другое имя';
      nameStreak.textContent = p.streak_days >= 2 ? '🔥 ' + p.streak_days + ' дней подряд — не прерывай серию!' : '';
    } else {
      nameWarn.textContent = '';
      nameStreak.textContent = '';
    }
  } catch(e){}
}
playerNameInput.addEventListener('blur', checkNameExists);
playerNameInput.addEventListener('input', () => { nameWarn.textContent = ''; nameStreak.textContent = ''; });

try {
  const saved = localStorage.getItem('beatdance_player');
  if(saved) playerNameInput.value = saved;
} catch(e){}
if(playerNameInput.value) checkNameExists();

document.getElementById('playBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;

const statsScreen = document.getElementById('statsScreen');
const statsList = document.getElementById('statsList');
let statsReturnScreen = startScreen;

async function openStats(returnScreen){
  statsReturnScreen = returnScreen;
  returnScreen.hidden = true;
  statsScreen.hidden = false;
  renderStatsList();
}

let statsPlayersCache = [];

async function renderStatsList(){
  statsList.innerHTML = '<div class="statsEmpty">Загрузка…</div>';
  try {
    const res = await fetch('/api/stats.php?game=dance');
    const data = await res.json();
    if(data.ok && data.players.length > 0){
      statsPlayersCache = data.players;
      statsList.innerHTML = data.players.map((p, i) => `
        <div class="statsRow" data-name="${escapeHtml(p.player_name)}">
          <div class="pos">${i+1}</div>
          <div class="pname">${escapeHtml(p.player_name)}</div>
          <div class="pgames">${p.games_played} игр</div>
          <div class="pscore">${p.best_score}</div>
        </div>
      `).join('');
    } else {
      statsList.innerHTML = '<div class="statsEmpty">Пока никто не играл — стань первой! 💃</div>';
    }
  } catch(e){
    statsList.innerHTML = '<div class="statsEmpty">Не удалось загрузить статистику</div>';
  }
}

statsList.addEventListener('click', (ev) => {
  const row = ev.target.closest('.statsRow[data-name]');
  if(!row) return;
  showPlayerDetail(row.dataset.name);
});

function showPlayerDetail(name){
  const p = statsPlayersCache.find(pl => pl.player_name === name);

  const streakLine = p && p.streak_days >= 2
    ? `<div class="statsRow"><div class="pname">🔥 Дней подряд</div><div class="pscore">${p.streak_days}</div></div>`
    : '';

  const badges = ACHIEVEMENTS.map(a => {
    const unlocked = p ? a.check(p) : false;
    return `
      <div class="badge ${unlocked ? 'unlocked' : ''}" title="${escapeHtml(a.desc)}">
        <div class="badgeIcon">${a.icon}</div>
        <div class="badgeName">${escapeHtml(a.name)}</div>
      </div>
    `;
  }).join('');

  statsList.innerHTML = `
    <button class="backToList" id="backToListBtn">← Все игроки</button>
    <div class="playerDetailHead">
      <div class="pdName">${escapeHtml(name)}</div>
    </div>
    <div class="statsRow">
      <div class="pname">Лучший результат</div>
      <div class="pscore">${p ? p.best_score : '—'}</div>
    </div>
    <div class="statsRow">
      <div class="pname">Лучшее комбо</div>
      <div class="pscore">${p ? p.best_combo : '—'}</div>
    </div>
    <div class="statsRow">
      <div class="pname">Лучшая точность</div>
      <div class="pscore">${p ? p.best_accuracy + '%' : '—'}</div>
    </div>
    ${streakLine}
    <div class="badgesTitle">Достижения</div>
    <div class="badgeGrid">${badges}</div>
  `;
  document.getElementById('backToListBtn').onclick = renderStatsList;
}

document.getElementById('statsBtn').onclick = () => openStats(startScreen);
document.getElementById('endStatsBtn').onclick = () => openStats(endScreen);

document.getElementById('statsBackBtn').onclick = () => {
  statsScreen.hidden = true;
  statsReturnScreen.hidden = false;
};

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function currentPlayerName(){
  const name = (playerNameInput.value || '').trim().slice(0,16);
  return name || 'Игрок';
}

function formatTime(sec){
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec/60);
  const s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

function startGame(){
  score = 0; combo = 0; maxCombo = 0; perfectCount = 0; goodCount = 0; missCount = 0;
  scoreVal.textContent = '0';
  comboVal.textContent = 'Комбо: 0';
  noteEls.forEach(el => el.remove());
  noteEls = new Map();

  try { localStorage.setItem('beatdance_player', currentPlayerName()); } catch(e){}

  startScreen.hidden = true;
  endScreen.hidden = true;
  gameScreen.hidden = false;

  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();

  buildEvents();
  startTime = scheduleAudio();
  songDuration = PRE_ROLL_SECONDS + ROUND_SECONDS;

  let count = PRE_ROLL_SECONDS;
  countdownEl.hidden = false;
  countdownEl.textContent = count;
  const countTimer = setInterval(() => {
    count--;
    if(count > 0){
      countdownEl.textContent = count;
    } else {
      countdownEl.hidden = true;
      clearInterval(countTimer);
    }
  }, 1000);

  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function loop(){
  const now = audioCtx.currentTime - startTime;
  const stageH = stage.clientHeight;
  const hitY = stageH * 0.84;

  const playNow = Math.max(0, now - PRE_ROLL_SECONDS);
  timeLeftEl.textContent = formatTime(ROUND_SECONDS - playNow);
  timerFillEl.style.width = Math.min(100, Math.max(0,(playNow/ROUND_SECONDS)*100)) + '%';

  events.forEach((e, idx) => {
    const remaining = e.time - now;
    const visible = now >= e.spawnTime && remaining > -0.35;
    let el = noteEls.get(idx);

    if(!e.judged && remaining < -MISS_WIN){
      e.judged = true;
      combo = 0;
      comboVal.textContent = 'Комбо: 0';
      missCount++;
      flashAvatar('shake');
    }

    if(visible && !e.judged){
      if(!el){
        el = document.createElement('div');
        el.className = 'note';
        el.innerHTML = arrowIcon(LANES[e.lane].dir);
        lanesEl.children[e.lane].appendChild(el);
        noteEls.set(idx, el);
      }
      const progress = 1 - (remaining / e.fallDur);
      el.style.top = (progress * hitY - 17) + 'px';
    } else if(el && e.judged){
      el.remove();
      noteEls.delete(idx);
    } else if(el && !visible){
      el.remove();
      noteEls.delete(idx);
    }
  });

  if(now < songDuration){
    rafId = requestAnimationFrame(loop);
  } else {
    endGame();
  }
}

function flashAvatar(cls){
  comboVal.classList.remove('pop','shake','hype');
  void comboVal.offsetWidth;
  comboVal.classList.add(cls);
}

function spawnBurst(lane, big){
  const container = lanesEl.children[lane];
  const laneColor = getComputedStyle(container).getPropertyValue('--lc').trim() || '#fff';

  const dotCount = big ? 28 : 18;
  for(let i=0;i<dotCount;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = Math.random()*Math.PI*2;
    const dist = (big ? 55 : 38) + Math.random()*(big ? 60 : 36);
    p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    p.style.setProperty('--dy', (-Math.abs(Math.sin(angle))*dist)+'px');
    const size = 5 + Math.random()*(big ? 8 : 6);
    p.style.width = size+'px';
    p.style.height = size+'px';
    const col = Math.random() < 0.45 ? 'var(--gold)' : laneColor;
    p.style.background = col;
    p.style.color = col;
    container.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  const sparkCount = big ? 14 : 6;
  for(let i=0;i<sparkCount;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const angle = Math.random()*Math.PI*2;
    const dist = (big ? 50 : 32) + Math.random()*(big ? 50 : 30);
    s.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
    s.style.setProperty('--dy', (-Math.abs(Math.sin(angle))*dist)+'px');
    s.style.setProperty('--rot', (angle*180/Math.PI)+'deg');
    s.style.height = (10+Math.random()*10)+'px';
    s.style.background = 'var(--gold)';
    s.style.boxShadow = '0 0 6px 1px var(--gold)';
    container.appendChild(s);
    setTimeout(() => s.remove(), 600);
  }
}

function showFx(lane, text, color){
  const fx = document.getElementById('fx'+lane);
  fx.textContent = text;
  fx.style.color = color;
  fx.classList.remove('show');
  void fx.offsetWidth;
  fx.classList.add('show');
}

function hitLane(lane){
  if(gameScreen.hidden) return;
  const now = audioCtx.currentTime - startTime;
  let bestIdx = -1, bestDiff = Infinity;
  events.forEach((e, idx) => {
    if(e.judged || e.lane !== lane) return;
    const diff = Math.abs(e.time - now);
    if(diff < bestDiff && diff <= MISS_WIN){
      bestDiff = diff;
      bestIdx = idx;
    }
  });
  if(bestIdx === -1) return;

  const e = events[bestIdx];
  e.judged = true;
  const el = noteEls.get(bestIdx);
  if(el){ el.remove(); noteEls.delete(bestIdx); }

  if(bestDiff <= PERFECT_WIN){
    score += 100 + combo*2;
    combo++;
    perfectCount++;
    showFx(lane, 'Идеально!', 'var(--gold)');
    spawnBurst(lane, true);
    flashAvatar(combo >= 15 ? 'hype' : 'pop');
    playHitSound(combo);
  } else if(bestDiff <= GOOD_WIN){
    score += 50 + combo;
    combo++;
    goodCount++;
    showFx(lane, 'Хорошо', 'var(--good)');
    spawnBurst(lane, false);
    flashAvatar('pop');
    playHitSound(combo);
  } else {
    combo = 0;
    missCount++;
    showFx(lane, 'Мимо', '#ff5b6a');
    flashAvatar('shake');
    playMissSound();
  }
  maxCombo = Math.max(maxCombo, combo);
  scoreVal.textContent = score;
  comboVal.textContent = (combo >= 5 ? '🔥 ' : '') + 'Комбо: ' + combo;
}

document.addEventListener('keydown', (ev) => {
  const idx = LANES.findIndex(l => l.key === ev.key);
  if(idx === -1) return;
  ev.preventDefault();
  hitLane(idx);
  const btn = controlsEl.children[idx];
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 120);
});

controlsEl.addEventListener('pointerdown', (ev) => {
  const btn = ev.target.closest('.padBtn');
  if(!btn) return;
  ev.preventDefault();
  const lane = parseInt(btn.dataset.lane);
  hitLane(lane);
  btn.classList.add('active');
  setTimeout(() => btn.classList.remove('active'), 120);
});

document.addEventListener('dblclick', (ev) => ev.preventDefault());

function endGame(){
  cancelAnimationFrame(rafId);
  noteEls.forEach(el => el.remove());
  noteEls = new Map();
  gameScreen.hidden = true;
  endScreen.hidden = false;

  const total = events.length;
  const acc = total ? Math.round(((perfectCount + goodCount) / total) * 100) : 0;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalCombo').textContent = maxCombo;
  document.getElementById('finalAcc').textContent = acc + '%';

  let rank, msg;
  if(acc >= 95){ rank='S'; msg='Невероятно! Это выступление достойно сцены 🔥'; }
  else if(acc >= 85){ rank='A'; msg='Огонь! Почти без ошибок 💥'; }
  else if(acc >= 70){ rank='B'; msg='Хорошо! Чувство ритма есть 🎶'; }
  else if(acc >= 50){ rank='C'; msg='Неплохо, но можно точнее 👍'; }
  else { rank='D'; msg='Потренируйся ещё разок! 💃'; }
  document.getElementById('rankVal').textContent = currentPlayerName();
  document.getElementById('rankBadgeVal').textContent = RANK_TITLES[rank];
  document.getElementById('rankMsg').textContent = msg;

  saveAndLoadHistory(score, maxCombo, acc, rank);
}

async function saveAndLoadHistory(finalScore, finalMaxCombo, acc, rank){
  const name = currentPlayerName();
  const historyBox = document.getElementById('historyBox');
  try {
    await fetch('/api/save_score.php', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        game: 'dance',
        player_name: name,
        score: finalScore,
        max_combo: finalMaxCombo,
        accuracy: acc,
        rank: rank,
      }),
    });

    const res = await fetch('/api/history.php?game=dance&player=' + encodeURIComponent(name));
    const data = await res.json();
    if(data.ok){
      document.getElementById('bestScoreVal').textContent = data.best ? data.best.score : finalScore;
      document.getElementById('playCountVal').textContent = data.history.length;
      historyBox.hidden = false;
    }
  } catch(e){
    historyBox.hidden = true;
  }
}
